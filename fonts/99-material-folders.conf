<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Los folder-icons Material viven en PUA F2xxx (fuente MaterialFolders, CBDT color).
       Symbola (fuente catch-all de símbolos) también reclama esos PUA y, vía fontconfig,
       ganaba en alacritty → dibujaba un cuadro tofu en vez del icono.
       Rechazamos Symbola para que MaterialFolders sea la que cubra F2xxx. Los emoji
       siguen viniendo de Noto Color Emoji; solo se pierde la cobertura de símbolos
       exóticos de Symbola (rara vez usados). -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Symbola</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
