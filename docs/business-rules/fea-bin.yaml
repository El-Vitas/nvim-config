id: FEA-BIN
name: Archivos binarios
purpose: Qué pasa al abrir imágenes, PDF, documentos de ofimática y comprimidos.
scope: binarios
rules:
  - id: BR-eeeb1e0
    status: active
    title: A binary file is opened with the system app or shown raw, never corrupted
    rule: >-
      When a binary file (image, PDF, office document, archive) is opened, the editor shows a help screen and offers to
      open it with the system's default app (<leader>o) or to view its raw bytes (<leader>O). Saving from the help
      screen never writes that text over the file.
    why: >-
      Dumping the bytes of a PNG on screen helps nobody, and a careless :w on the help screen would destroy the original
      file.
    supersedes: BR-802772a
    scenarios:
      - title: Open an image
        given: The user opens logo.png
        when: They choose "Open with system app"
        then: The image opens in the system's default viewer
      - title: Save the help screen
        given: The help screen for logo.png is open
        when: The user runs :w
        then: logo.png does not change
  - id: BR-802772a
    status: superseded
    title: Un binario se abre con la app del sistema o se muestra crudo, nunca se corrompe
    rule: >-
      Al abrir un archivo binario (imagen, PDF, ofimática, comprimido), el editor muestra una pantalla de ayuda y ofrece
      abrirlo con la app predeterminada del sistema (<leader>o) o ver sus bytes crudos (<leader>O). Guardar desde la
      pantalla de ayuda nunca escribe ese texto sobre el archivo.
    why: >-
      Volcar los bytes de un PNG en pantalla no le sirve a nadie, y un :w distraído sobre la pantalla de ayuda
      destruiría el archivo original.
    superseded_by: BR-eeeb1e0
    scenarios:
      - title: Abrir una imagen
        given: El usuario abre logo.png
        when: Elige "Open with system app"
        then: La imagen se abre en el visor predeterminado del sistema
      - title: Guardar la ayuda
        given: La pantalla de ayuda de logo.png está abierta
        when: El usuario ejecuta :w
        then: logo.png no cambia
