id: FEA-BIN
name: Archivos binarios
purpose: Qué pasa al abrir imágenes, PDF, documentos de ofimática y comprimidos.
scope: binarios
rules:
  - id: BR-802772a
    status: active
    title: Un binario se abre con la app del sistema o se muestra crudo, nunca se corrompe
    rule: >-
      Al abrir un archivo binario (imagen, PDF, ofimática, comprimido), el editor muestra una pantalla de ayuda y ofrece
      abrirlo con la app predeterminada del sistema (<leader>o) o ver sus bytes crudos (<leader>O). Guardar desde la
      pantalla de ayuda nunca escribe ese texto sobre el archivo.
    why: >-
      Volcar los bytes de un PNG en pantalla no le sirve a nadie, y un :w distraído sobre la pantalla de ayuda
      destruiría el archivo original.
    scenarios:
      - title: Abrir una imagen
        given: El usuario abre logo.png
        when: Elige "Open with system app"
        then: La imagen se abre en el visor predeterminado del sistema
      - title: Guardar la ayuda
        given: La pantalla de ayuda de logo.png está abierta
        when: El usuario ejecuta :w
        then: logo.png no cambia
