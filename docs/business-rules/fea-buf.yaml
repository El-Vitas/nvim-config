id: FEA-BUF
name: Buffers abiertos
purpose: Cuántos archivos quedan cargados a la vez y cuáles se cierran solos.
scope: buffers
rules:
  - id: BR-17614a6
    status: active
    title: Se mantienen como máximo cinco archivos cargados
    rule: >-
      Al abrir un archivo nuevo, si quedan más de cinco archivos cargados, se cierra el que se usó hace más tiempo.
      Nunca se cierra un archivo con cambios sin guardar ni uno visible en alguna ventana. Un archivo cerrado así sigue
      siendo alcanzable desde la lista de cambios de review (quickfix), las marcas y el historial de saltos.
    why: >-
      Mantiene corta la lista de buffers y el editor liviano, sin arriesgar trabajo sin guardar ni romper la navegación
      hacia archivos ya visitados.
    supersedes: BR-da9557e
    superseded_reason: >-
      El cierre borraba el buffer por completo y la quickfix de cambios perdía la referencia al archivo; ahora se cierra
      con la semántica de :bdelete.
    scenarios:
      - title: Sexto archivo
        given: Hay cinco archivos cargados, ninguno modificado ni visible salvo el actual
        when: El usuario abre un sexto archivo
        then: Se cierra el archivo usado hace más tiempo
      - title: Lista de cambios
        given: La quickfix de cambios de review apunta a un archivo que se cerró por el límite
        when: El usuario elige esa entrada
        then: Se abre el archivo
  - id: BR-da9557e
    status: superseded
    title: Se mantienen como máximo cinco archivos cargados
    rule: >-
      Al abrir un archivo nuevo, si quedan más de cinco archivos cargados, se cierra el que se usó hace más tiempo.
      Nunca se cierra un archivo con cambios sin guardar ni uno visible en alguna ventana.
    why: Mantiene corta la lista de buffers y el editor liviano, sin arriesgar trabajo sin guardar.
    superseded_by: BR-17614a6
    superseded_reason: >-
      El cierre borraba el buffer por completo y la quickfix de cambios perdía la referencia al archivo; ahora se cierra
      con la semántica de :bdelete.
    scenarios:
      - title: Sexto archivo
        given: Hay cinco archivos cargados, ninguno modificado ni visible salvo el actual
        when: El usuario abre un sexto archivo
        then: Se cierra el archivo usado hace más tiempo
      - title: Archivo modificado
        given: El archivo más antiguo tiene cambios sin guardar
        when: El usuario abre un archivo que supera el límite
        then: Ese archivo no se cierra
